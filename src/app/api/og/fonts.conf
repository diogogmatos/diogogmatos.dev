<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts the OG image is drawn with. Vercel's servers have none installed, so these are
     the only ones it uses, which also makes it look the same when running locally -->
<fontconfig>
  <dir prefix="relative">../../fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>
</fontconfig>
